workflows:
  ios-workflow-id:
    name: iOS Sample Workflow
    max_build_duration: 30
    instance_type: mac_mini_m2

    scripts:
      - name: Build Vexo App
        script: | 
          # البحث عن مكان وجود ملف .xcodeproj والدخول للمجلد
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          
          echo "Found project at: $PROJECT_PATH"
          cd "$PROJECT_DIR"
          
          # الحصول على اسم المشروع الفعلي (بدون .xcodeproj)
          PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          
          # تنفيذ البناء باستخدام الاسم والمسار الصحيحين
          xcodebuild -project "$PROJECT_NAME.xcodeproj" \
                     -scheme "$PROJECT_NAME" \
                     -sdk iphoneos \
                     -configuration Release \
                     build \
                     -derivedDataPath ./build
          
    artifacts:
      # البحث عن أي ملف .app أو .ipa ناتج في أي مكان
      - "**/build/Build/Products/Release-iphoneos/*.app"
      - "**/build/ios/ipa/*.ipa"
      - "**/*.ipa"

    publishing:
      email:
        recipients:
          - mojahedmohdsaad@gmail.com
        notify:
          success: true
